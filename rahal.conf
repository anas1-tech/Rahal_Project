# Admin pages write files to disk (lost on Render redeploys) and have no login: keep them off the public site.
<FilesMatch "^(add_attraction|save_attraction)\.php$">
    Require all denied
</FilesMatch>
# Don't serve the raw database dump or the init script.
<Directory /var/www/html/DB>
    Require all denied
</Directory>
<FilesMatch "^(db_init|pg_compat|db_connect)\.php$">
    Require all denied
</FilesMatch>

# Browser caching + compression for static files
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/png  "access plus 30 days"
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/x-icon "access plus 30 days"
    ExpiresByType text/css   "access plus 7 days"
    ExpiresByType application/javascript "access plus 7 days"
    ExpiresByType text/javascript "access plus 7 days"
</IfModule>
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript text/javascript application/json image/svg+xml
</IfModule>
