# Admin pages write files to disk (lost on Render redeploys) and have no login: keep them off the public site.
<FilesMatch "^(add_attraction|save_attraction)\.php$">
    Require all denied
</FilesMatch>
# Don't serve the raw database dump or the init script.
<Directory /var/www/html/DB>
    Require all denied
</Directory>
<FilesMatch "^(db_init|pg_compat|db_connect)\.php$">
    Require all denied
</FilesMatch>
